# SPDX-License-Identifier: Apache-2.0
#
# CLA gate. A pull request is blocked by a failing status check until every
# author on it has signed, and signing is a comment on the PR itself.
#
# Signatures are committed to signatures/version1/cla.json in this repository,
# so the record lives with the code and needs no external service.
#
# The action (contributor-assistant/github-action, formerly CLA Assistant
# Lite) was archived upstream on 2026-03-23. It still works -- it is pinned
# here to the v2.6.1 commit, and an archived repository is read-only, so that
# tag cannot move under us. It will not receive fixes, though: if it ever
# breaks against a GitHub API change, the choices are a maintained fork, the
# hosted cla-assistant.io, or dropping to a DCO like the sibling repositories.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# pull_request_target runs in the base repository's context with these
# permissions. That is safe here only because this workflow never checks out
# or executes the pull request's code -- do not add a checkout step to it.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA check
        # The comment body must match custom-pr-sign-comment below exactly.
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/tishden/rs-fec/blob/main/CLA.md
          branch: main
          allowlist: tishden,dependabot[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged, every author
            on it needs to sign the [Contributor License
            Agreement](https://github.com/tishden/rs-fec/blob/main/CLA.md).
            It is a licence, not an assignment: you keep the copyright in what
            you write. To sign, post a comment on this pull request containing
            exactly:
          custom-allsigned-prcomment: >-
            All contributors have signed the CLA. Thanks.
